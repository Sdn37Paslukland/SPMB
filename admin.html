<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel Kontrol Admin PPDB — SDN 37/II</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --g9:#0a3d2e;--g8:#0d5c42;--g7:#116a4b;--g5:#22a878;
  --gr9:#111714;--gr2:#e4eee9;--gr0:#f8fbf9;--white:#fff;--r5:#ef4444;
}
*{box-sizing:border-box; margin:0; padding:0}
body{font-family:'DM Sans',sans-serif; background:#f2f7f4; color:var(--gr9); padding:20px}

#lock-screen{position:fixed; inset:0; background:linear-gradient(160deg,var(--g9) 0%,#0d4a38 100%); z-index:500; display:flex; align-items:center; justify-content:center}
.lock-box{background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.12); border-radius:24px; padding:36px; max-width:360px; width:100%; text-align:center; backdrop-filter:blur(20px)}
.lock-input{width:100%; background:rgba(255,255,255,.08); border:1.5px solid rgba(255,255,255,.15); border-radius:12px; padding:12px; font-size:14px; color:#fff; text-align:center; outline:none; margin-bottom:15px}
.lock-btn{width:100%; background:linear-gradient(135deg,var(--g7),var(--g5)); color:#fff; border:none; border-radius:12px; padding:13px; font-weight:700; cursor:pointer}

.hdr-panel{display:flex; justify-content:between; align-items:center; max-width:1100px; margin:0 auto 20px; background:white; padding:15px 20px; border-radius:12px; border:1px solid var(--gr2)}
.admin-card{background:var(--white); border:1px solid var(--gr2); border-radius:16px; padding:20px; box-shadow:0 4px 12px rgba(10,63,46,0.03); max-width:1100px; margin:0 auto; overflow-x:auto}
table{width:100%; border-collapse:collapse; min-width:800px; font-size:13px}
th,td{padding:12px 14px; text-align:left; border-bottom:1px solid var(--gr2)}
th{background:var(--gr0); color:var(--g7); font-weight:700}
.btn{padding:8px 14px; border-radius:8px; border:none; cursor:pointer; font-weight:700; font-size:12px; margin-left:5px}
.btn-main{background:var(--g7); color:white}
.btn-danger{background:#fef2f2; color:var(--r5)}
</style>
</head>
<body>

<div id="lock-screen">
  <div class="lock-box">
    <h2 style="color:white; margin-bottom:8px">Portal PPDB Admin</h2>
    <input type="password" class="lock-input" id="lock-pass" placeholder="Kata Sandi Panitia">
    <button class="lock-btn" onclick="doUnlock()">Masuk Kontrol</button>
    <div id="lock-err" style="color:#f87171; font-size:12px; margin-top:10px; display:none">Kata sandi salah!</div>
  </div>
</div>

<div id="admin-content" style="display:none">
  <div class="hdr-panel" style="display:flex; justify-content:space-between; align-items:center">
    <div>
      <h2 style="font-size:18px; color:var(--g9)">Data Masuk PPDB 2026/2027</h2>
    </div>
    <div>
      <button class="btn btn-main" onclick="exportCSV()">Unduh Excel (CSV)</button>
      <button class="btn" style="background:#eee" onclick="fetchData()">Segarkan Data</button>
    </div>
  </div>

  <div class="admin-card">
    <table>
      <thead>
        <tr>
          <th>No. Reg</th>
          <th>Nama Lengkap</th>
          <th>NIK</th>
          <th>L/P</th>
          <th>No. WA Wali</th>
          <th>Tanggal Daftar</th>
          <th>Aksi</th>
        </tr>
      </thead>
      <tbody id="data-list"></tbody>
    </table>
  </div>
</div>

<script>
const SHEET_API = 'https://script.google.com/macros/s/AKfycbyz8ijUjN1ZYqHOw7tGzVcdH_Pn2b8nnxo6Qo9xRHNODZYXAP13abTLV_ltoO4MEZ8WEA/exec';
const ADMIN_PASS = 'sdn37admin2026';
let listSiswa = [];

function doUnlock() {
  if (document.getElementById('lock-pass').value === ADMIN_PASS) {
    document.getElementById('lock-screen').style.display = 'none';
    document.getElementById('admin-content').style.display = 'block';
    fetchData();
  } else {
    document.getElementById('lock-err').style.display = 'block';
  }
}

function fetchData() {
  fetch(SHEET_API).then(r => r.json()).then(data => {
    if(Array.isArray(data)){
      listSiswa = data;
      document.getElementById('data-list').innerHTML = data.map(item => `
        <tr>
          <td><b>${item.id}</b></td>
          <td style="text-transform:uppercase">${item.nama}</td>
          <td>${item.nik}</td>
          <td>${item.gender}</td>
          <td>${item.telp}</td>
          <td style="color:#666; font-size:11px">${item.timestamp}</td>
          <td><button class="btn btn-danger" onclick="hapusData('${item.id}')">Hapus</button></td>
        </tr>
      `).join('');
    }
  });
}

function hapusData(id) {
  if(confirm(`Hapus pendaftar ${id} secara permanen?`)){
    fetch(`${SHEET_API}/id/${encodeURIComponent(id)}`, { method: 'DELETE' })
      .then(() => { alert('Data terhapus!'); fetchData(); });
  }
}

function exportCSV() {
  if (!listSiswa.length) return;
  const headers = ['No Registrasi','Nama','NIK','Gender','No WA','Waktu Registrasi'];
  const csvRows = listSiswa.map(s => [s.id, s.nama, s.nik, s.gender, s.telp, s.timestamp].join(','));
  const blob = new Blob(['\uFEFF' + [headers.join(','), ...csvRows].join('\n')], { type: 'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'Data_PPDB_SDN37.csv';
  a.click();
}
</script>
</body>
</html>
